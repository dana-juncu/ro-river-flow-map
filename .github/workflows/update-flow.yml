name: Update modelled river flow
on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"     # daily, ~08:40 Bucharest
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_flow.py
      - name: Commit if changed
        run: |
          git config user.name "flow-bot"; git config user.email "flow-bot@users.noreply.github.com"
          git add data/flow.json
          git diff --cached --quiet || git commit -m "Update modelled flow $(date -u +%F)"
          git push
